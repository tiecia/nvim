name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Configuration checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Check formatting, diagnostics, and startup
        run: nix develop path:. --command make check-local
      - name: Check flake outputs
        run: nix flake check path:.
